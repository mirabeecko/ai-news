<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI News — Forever Actual</title>
  <meta name="description" content="Odborné novinky ze světa AI — modely, plány, robotika. Nikdy nebuďte late.">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="/assets/tailwind.css">
  <style>
    /* === AI News Design System === */
    :root {
      --bg-deep: #0a0e17;
      --bg-card: #111827;
      --bg-card-hover: #1a2332;
      --bg-surface: #0f1724;
      --border-subtle: #1e293b;
      --accent-cyan: #00e5ff;
      --accent-cyan-dim: rgba(0, 229, 255, 0.08);
      --accent-amber: #ffb428;
      --accent-amber-dim: rgba(255, 180, 40, 0.08);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* === Header === */
    .site-header {
      background: linear-gradient(180deg, rgba(0,229,255,0.03) 0%, transparent 100%);
      border-bottom: 1px solid var(--border-subtle);
      padding: 1.5rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-dot {
      width: 10px;
      height: 10px;
      background: var(--accent-cyan);
      border-radius: 50%;
      animation: pulse-dot 2s ease-in-out infinite;
      box-shadow: 0 0 12px var(--accent-cyan);
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 12px var(--accent-cyan); }
      50% { opacity: 0.5; transform: scale(1.3); box-shadow: 0 0 20px var(--accent-cyan); }
    }

    .site-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .site-title span {
      color: var(--accent-cyan);
    }

    .last-updated {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .last-updated time {
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse-dot 3s ease-in-out infinite;
    }

    /* === Category Tabs === */
    .cat-tabs {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.5rem 0;
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .cat-tab {
      padding: 0.5rem 1.25rem;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .cat-tab:hover {
      border-color: var(--accent-cyan);
      color: var(--text-primary);
      background: var(--accent-cyan-dim);
    }

    .cat-tab.active {
      background: var(--accent-cyan);
      color: var(--bg-deep);
      border-color: var(--accent-cyan);
      font-weight: 600;
    }

    /* === Main Content === */
    .main-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* === Category Sections === */
    .category-section.hidden {
      display: none;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .category-icon {
      font-size: 1.5rem;
    }

    .category-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .category-count {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--bg-card);
      padding: 0.15rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
    }

    .category-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    /* === News Grid === */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }

    /* === News Card === */
    .news-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.25rem;
      transition: border-color 0.2s ease, background 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .news-card:hover {
      border-color: rgba(0, 229, 255, 0.25);
      background: var(--bg-card-hover);
    }

    .news-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .news-date {
      font-size: 0.78rem;
      color: var(--accent-cyan);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .verified-badge {
      font-size: 0.7rem;
      padding: 0.1rem 0.5rem;
      border-radius: 4px;
      background: rgba(34, 197, 94, 0.1);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.2);
      font-weight: 500;
      white-space: nowrap;
    }

    .news-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .news-summary {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.55;
      flex-grow: 1;
    }

    .news-sources {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
      font-size: 0.75rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border-subtle);
    }

    .sources-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .source-link {
      color: var(--accent-cyan);
      text-decoration: none;
      transition: color 0.15s;
    }

    .source-link:hover {
      color: #fff;
    }

    .source-sep {
      color: var(--border-subtle);
      user-select: none;
    }

    /* === Tags === */
    .tag {
      font-size: 0.68rem;
      padding: 0.1rem 0.5rem;
      border-radius: 4px;
      font-weight: 500;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }

    .tag-cyan { background: rgba(0,229,255,0.1); color: var(--accent-cyan); border: 1px solid rgba(0,229,255,0.2); }
    .tag-amber { background: rgba(255,180,40,0.1); color: var(--accent-amber); border: 1px solid rgba(255,180,40,0.2); }
    .tag-green { background: rgba(34,197,94,0.1); color: #22c55e; border: 1px solid rgba(34,197,94,0.2); }
    .tag-purple { background: rgba(168,85,247,0.1); color: #a855f7; border: 1px solid rgba(168,85,247,0.2); }
    .tag-blue { background: rgba(59,130,246,0.1); color: #3b82f6; border: 1px solid rgba(59,130,246,0.2); }
    .tag-red { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
    .tag-default { background: rgba(148,163,184,0.1); color: var(--text-muted); border: 1px solid rgba(148,163,184,0.15); }

    /* === States === */
    .loading-state, .error-state, .empty-state {
      text-align: center;
      padding: 4rem 1.5rem;
    }

    .loading-pulse {
      width: 40px;
      height: 40px;
      margin: 0 auto 1rem;
      border: 3px solid var(--border-subtle);
      border-top-color: var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { color: var(--text-muted); font-size: 0.9rem; }

    .error-icon { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; }
    .error-text { color: #ef4444; font-size: 0.95rem; }

    .empty-state p { color: var(--text-muted); font-size: 0.95rem; }

    /* === Footer === */
    .site-footer {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      border-top: 1px solid var(--border-subtle);
      text-align: center;
    }

    .footer-text {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .footer-text a {
      color: var(--accent-cyan);
      text-decoration: none;
    }

    .footer-text a:hover { text-decoration: underline; }

    /* === Responsive === */
    @media (max-width: 640px) {
      .header-inner { flex-direction: column; align-items: flex-start; }
      .news-grid { grid-template-columns: 1fr; }
      .site-title { font-size: 1.15rem; }
      .category-title { font-size: 1.25rem; }
      .cat-tab { padding: 0.4rem 0.9rem; font-size: 0.8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-dot, .live-dot, .loading-pulse { animation: none; }
      .news-card { transition: none; }
      .cat-tab { transition: none; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-group">
        <div class="logo-dot" aria-hidden="true"></div>
        <h1 class="site-title">AI<span>News</span></h1>
      </div>
      <div class="last-updated">
        <div class="live-dot" aria-hidden="true"></div>
        <span>Aktualizováno</span>
        <time id="last-updated-time" datetime="">—</time>
      </div>
    </div>
  </header>

  <!-- Category Tabs -->
  <nav class="cat-tabs" id="category-tabs" aria-label="Kategorie novinek">
    <!-- Dynamicky renderováno z news.json -->
  </nav>

  <!-- Main Content -->
  <main class="main-content" id="news-container">
    <!-- Renderováno JS -->
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p class="footer-text">
      AI News — forever actual. Dvouzdrojová verifikace. Denní aktualizace.
      &nbsp;·&nbsp; <a href="https://github.com/mirabeecko/ai-news" target="_blank" rel="noopener">GitHub</a>
      &nbsp;·&nbsp; <a href="https://ai-news-six-delta.vercel.app" target="_blank" rel="noopener">Vercel</a>
    </p>
  </footer>

  <!-- JavaScript -->
  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
